<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>咪卡Mik词库 — 用户管理</title>
<style>
:root{--bg:#0f172a;--card-bg:#1e293b;--text:#f1f5f9;--text-muted:#64748b;--border:#334155;--primary:#3b82f6;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}
@media (prefers-color-scheme:light){:root{--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-muted:#94a3b8;--border:#e5e7eb}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav-bar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-bar h4{margin:0;font-size:15px;font-weight:700}
.nav-bar a{color:var(--text-muted);text-decoration:none;font-size:13px}
.nav-bar a:hover{color:var(--primary)}
.container{max-width:1100px;margin:0 auto;padding:20px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.search-box{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;width:220px;background:var(--bg);color:var(--text);outline:none}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-outline{padding:6px 12px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-muted);cursor:pointer}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-outline-danger:hover{border-color:var(--danger);color:var(--danger)}
.filter-btn{padding:6px 12px;border:1px solid var(--border);border-radius:8px;font-size:11px;cursor:pointer;background:var(--bg);color:var(--text-muted);font-weight:600}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-btn:hover:not(.active){border-color:var(--primary)}
.stat-bar{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.stat-chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--card-bg);border:1px solid var(--border);color:var(--text-muted)}
.stat-chip .num{color:var(--text);font-size:15px}

.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.user-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px;transition:all .2s;cursor:pointer;position:relative}
.user-card:hover{border-color:var(--primary);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.user-card.selected{border-color:var(--primary);outline:2px solid var(--primary);outline-offset:-2px}
.user-card-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.user-avatar{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;font-size:20px;flex-shrink:0;color:#fff}
.user-info{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-username{font-size:11px;color:var(--text-muted)}
.user-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-admin{background:rgba(59,130,246,.15);color:#3b82f6}
.badge-editor{background:rgba(16,185,129,.15);color:#10b981}
.badge-viewer{background:rgba(148,163,184,.15);color:#94a3b8}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.status-active{background:var(--success)}.status-inactive{background:var(--text-muted)}
.user-card-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.user-footer{font-size:10px;color:var(--text-muted)}

/* Batch bar */
.batch-bar{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);border:1px solid var(--primary);border-radius:12px;padding:10px 20px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.2);gap:12px;align-items:center}
.batch-bar.show{display:flex}
.batch-bar span{font-size:12px;font-weight:600;color:var(--text)}
.batch-bar button{font-size:11px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--card-bg);border-radius:12px;padding:24px;max-width:480px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-box h4{margin:0 0 16px;font-size:15px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}

.empty{text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1}
.empty .icon{font-size:48px;display:block;margin-bottom:12px}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transform:translateY(-10px);transition:all .3s}
.toast.show{opacity:1;transform:translateY(0)}
.toast-success{background:var(--success);color:#fff}.toast-error{background:var(--danger);color:#fff}.toast-info{background:var(--primary);color:#fff}

/* Avatar picker */
.avatar-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.avatar-grid span{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;border:2px solid transparent;transition:.15s}
.avatar-grid span:hover{border-color:var(--primary);transform:scale(1.1)}
.avatar-grid span.sel{border-color:var(--primary);background:var(--primary-light)}
.color-grid{display:flex;gap:6px}
.color-grid span{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.color-grid span:hover{transform:scale(1.15)}
.color-grid span.sel{border-color:#fff;box-shadow:0 0 0 2px var(--primary)}
</style>
</head>
<body>
<div class="nav-bar">
  <div style="display:flex;align-items:center;gap:16px;">
    <a href="/">← 返回首页</a>
    <h4>👥 用户管理</h4>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:11px;color:var(--text-muted);" id="online_count">—</span>
  </div>
</div>
<div class="container" id="app"><div class="empty"><div class="icon">⏳</div><p>加载中...</p></div></div>
<div class="batch-bar" id="batchBar"><span id="batchCount">已选 0 项</span><button class="btn btn-outline" onclick="PMU.batchToggle(true)">启用</button><button class="btn btn-outline" onclick="PMU.batchToggle(false)">禁用</button><button class="btn btn-outline-danger" onclick="PMU.batchDelete()">批量删除</button><button class="btn btn-outline" onclick="PMU.clearBatch()">取消</button></div>
<div class="toast" id="toast"></div>

<script>
var PMU = { users:[], filter:'', query:'', sel:new Set(), _colors: ['#7c3aed','#dc2626','#2563eb','#059669','#d97706','#db2777','#4f46e5','#0891b2','#ea580c','#65a30d'], _emojis: '🦊🐱🐶🐼🐨🐯🦁🐸🐵🐰🐻🐧🦄🐙🦉🐳🦋🎨🎬🎧🎮💎⭐🌈'.split(''), _tab:'all' };

  function init() { var t = localStorage.getItem('pk_token'); if (!t) { location.href='/'; return; }
    fetch('/api/auth/me',{headers:{'Authorization':'***'+t}}).then(function(r){return r.json();}).then(function(d){if(!d.authenticated||d.user.role!=='admin'){document.getElementById('app').innerHTML='<div class="empty"><div class="icon">🚫</div><p>仅管理员可访问</p><a href="/">返回首页</a></div>';return;}PMU._me=d.user;PMU.render();}); }
  function toast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast toast-'+(t||'success')+' show';setTimeout(function(){el.classList.remove('show')},2000);}

  async function render() {
    var q = document.getElementById('searchQ')?document.getElementById('searchQ').value.trim():'';
    var url = '/api/auth/users' + (PMU.filter?'?role='+PMU.filter:'') + (q?(PMU.filter?'&':'?')+'q='+encodeURIComponent(q):'');
    try { var r = await fetch(url,{headers:{'Authorization':'***'+localStorage.getItem('pk_token')}}); var d = await r.json(); PMU.users = d.users||[]; } catch(e) { PMU.users = []; }
    var h = '<div class="toolbar"><div style="display:flex;gap:8px;flex:1;align-items:center;flex-wrap:wrap;"><input type="text" class="search-box" id="searchQ" placeholder="搜索用户..." oninput="PMU.render()">';
    var roles = [{v:'',l:'全部'},{v:'admin',l:'管理员'},{v:'editor',l:'编辑员'},{v:'viewer',l:'观察者'}];
    roles.forEach(function(r){h+='<button class="filter-btn'+(PMU.filter===r.v?' active':'')+'" onclick="PMU.setFilter(\''+r.v+'\')">'+r.l+'</button>';});
    var stats = {admin:0,editor:0,viewer:0,active:0}; PMU.users.forEach(function(u){stats[u.role]=(stats[u.role]||0)+1;if(u.is_active)stats.active++;});
    h += '</div><div style="display:flex;gap:8px;"><button class="btn btn-primary" onclick="PMU.showForm()">+ 添加用户</button><button class="btn btn-outline" onclick="PMU.toggleSelectMode()">'+(PMU._selMode?'退出选择':'☑ 批量选择')+'</button></div></div>';
    h += '<div class="stat-bar"><div class="stat-chip">📊 总计 <span class="num">'+PMU.users.length+'</span></div><div class="stat-chip">✅ 启用 <span class="num">'+stats.active+'</span></div><div class="stat-chip">🔵 管理员 <span class="num">'+stats.admin+'</span></div><div class="stat-chip">🟢 编辑员 <span class="num">'+stats.editor+'</span></div><div class="stat-chip">⚪ 观察者 <span class="num">'+stats.viewer+'</span></div></div>';

    if (!PMU.users.length) { h += '<div class="empty"><div class="icon">👤</div><h4>暂无用户</h4></div>'; }
    else { h += '<div class="user-grid">';
      PMU.users.forEach(function(u){
        var ac = u.avatar_color||PMU._colors[Math.abs(hash(u.username))%PMU._colors.length];
        var av = (u.display_name||u.username).charAt(0).toUpperCase();
        var selCls = PMU.sel.has(u.id)?' selected':'';
        h += '<div class="user-card'+selCls+'" data-uid="'+u.id+'" onclick="PMU.onCardClick('+u.id+',event)"><div class="user-card-header"><div class="user-avatar" style="background:'+ac+';">'+av+'</div><div class="user-info"><div class="user-name">'+esc(u.display_name||u.username)+'</div><div class="user-username">@'+u.username+'</div></div></div><div class="user-meta"><span class="badge badge-'+u.role+'">'+({admin:'管理员',editor:'编辑员',viewer:'观察者'}[u.role]||u.role)+'</span><span><span class="status-dot '+(u.is_active?'status-active':'status-inactive')+'"></span>'+(u.is_active?'正常':'已禁用')+'</span></div><div class="user-footer">'+(u.last_login_at?'最后登录: '+u.last_login_at.substring(0,10):'从未登录')+' · 创建: '+(u.created_at||'—').substring(0,10)+'</div><div class="user-card-actions"><button class="btn-outline" onclick="event.stopPropagation();PMU.showForm('+u.id+')">✏ 编辑</button><button class="btn-outline" onclick="event.stopPropagation();PMU.toggleUser('+u.id+','+(u.is_active?0:1)+')" style="color:'+(u.is_active?'var(--danger)':'var(--success)')+';">'+(u.is_active?'⏸ 停用':'▶ 启用')+'</button><button class="btn-outline btn-outline-danger" onclick="event.stopPropagation();PMU.confirmDelete('+u.id+',\''+esc(u.display_name||u.username)+'\')">🗑</button></div></div>';
      }); h += '</div>'; }
    document.getElementById('app').innerHTML = h;
  }

  function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function hash(s) { var h=0; for(var i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i); return Math.abs(h); }

  function setFilter(f) { PMU.filter = f; PMU.render(); }
  function onCardClick(id, e) { if (!PMU._selMode) { PMU.showForm(id); } else { PMU.sel.has(id)?PMU.sel.delete(id):PMU.sel.add(id); PMU.render(); PMU.updateBatchBar(); } }
  function toggleSelectMode() { PMU._selMode = !PMU._selMode; PMU.sel.clear(); PMU.render(); PMU.updateBatchBar(); }
  function clearBatch() { PMU.sel.clear(); PMU.render(); PMU.updateBatchBar(); }
  function updateBatchBar() { var el = document.getElementById('batchBar'); if (PMU.sel.size > 0) { el.classList.add('show'); document.getElementById('batchCount').textContent = '已选 '+PMU.sel.size+' 项'; } else { el.classList.remove('show'); } }

  async function batchToggle(active) { if (!confirm((active?'启用':'禁用')+'选中的 '+PMU.sel.size+' 个用户？')) return;
    var ids = Array.from(PMU.sel);
    try { await fetch('/api/auth/users/batch-toggle',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'***'+localStorage.getItem('pk_token')},body:JSON.stringify({user_ids:ids,is_active:active?1:0})}); toast((active?'已启用 ':'已禁用 ')+ids.length+' 个用户'); PMU.sel.clear(); PMU.render(); PMU.updateBatchBar(); } catch(e) { toast('操作失败','error'); } }
  async function batchDelete() { if (!confirm('确定永久删除选中的 '+PMU.sel.size+' 个用户？此操作不可撤销。')) return;
    for (var uid of PMU.sel) { try { await fetch('/api/auth/users/'+uid,{method:'DELETE',headers:{'Authorization':'***'+localStorage.getItem('pk_token')}}); } catch(e) {} }
    toast('已删除 '+PMU.sel.size+' 个用户'); PMU.sel.clear(); PMU.render(); PMU.updateBatchBar(); }

  async function showForm(uid) {
    var isNew = !uid;
    var u = {};
    if (uid) {
      u = PMU.users.find(function(x){return x.id===uid;}) || null;
      if (!u) {
        try { var r = await fetch('/api/auth/users/'+uid,{headers:{'Authorization':'***'+localStorage.getItem('pk_token')}}); var d = await r.json(); if (d.ok && d.user) u = d.user; } catch(e) {}
      }
      if (!u) u = {};
    }
    var ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.onclick = function(e) { if (e.target===ov) ov.remove(); };
    ov.innerHTML = '<div class="modal-box" onclick="event.stopPropagation()"><h4>'+(isNew?'➕ 添加用户':'✏ 编辑 '+esc(u.display_name||u.username))+'</h4>'
      + (!isNew ? '<div style="display:flex;gap:12px;margin-bottom:12px;align-items:center;"><div class="user-avatar" style="background:'+(u.avatar_color||PMU._colors[0])+';width:52px;height:52px;border-radius:14px;font-size:24px;" id="uf_avatar_preview">'+(u.display_name||u.username).charAt(0).toUpperCase()+'</div><div><div class="avatar-grid">'+PMU._emojis.map(function(e){return '<span onclick="PMU._pickAvatar(event,\''+e+'\')">'+e+'</span>';}).join('')+'</div><div class="color-grid">'+PMU._colors.map(function(c){return '<span style="background:'+c+';" onclick="PMU._pickColor(event,\''+c+'\')"></span>';}).join('')+'</div></div></div>' : '')
      + (isNew ? '<div class="form-group"><label>用户名</label><input type="text" id="uf_username" placeholder="字母/数字/下划线" autofocus></div><div class="form-group"><label>密码</label><input type="password" id="uf_password" placeholder="至少4个字符"></div>' : '')
      + '<div class="form-group"><label>显示名称</label><input type="text" id="uf_display" value="'+esc(u.display_name||'')+'"></div>'
      + '<div class="form-group"><label>角色</label><select id="uf_role"><option value="admin"'+(u.role==='admin'?' selected':'')+'>管理员</option><option value="editor"'+(u.role==='editor'?' selected':'')+'>编辑员</option><option value="viewer"'+(u.role==='viewer'?' selected':'')+'>观察者</option></select></div>'
      + (!isNew?'<div class="form-group"><label>密码重置（留空不修改）</label><input type="password" id="uf_pw_reset" placeholder="至少4个字符"></div>':'')
      + '<div class="modal-actions"><button class="btn btn-outline" onclick="this.closest(\'.modal-overlay\').remove()">取消</button><button class="btn btn-primary" id="uf_save">保存</button></div></div>';
    document.body.appendChild(ov);

    PMU._selAvatar = ''; PMU._selColor = '';
    document.getElementById('uf_save').onclick = async function() {
      var data = { display_name: document.getElementById('uf_display').value.trim(), role: document.getElementById('uf_role').value };
      if (PMU._selAvatar) data.avatar = PMU._selAvatar;
      if (PMU._selColor) data.avatar_color = PMU._selColor;
      if (!isNew) {
        var pw = document.getElementById('uf_pw_reset').value; if (pw) data.new_password = pw;
        try { var r = await fetch('/api/auth/users/'+uid,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'***'+localStorage.getItem('pk_token')},body:JSON.stringify(data)}); var rd = await r.json(); if (rd.ok) { ov.remove(); toast('已更新'); PMU.render(); } else toast(rd.detail||'更新失败','error'); } catch(e) { toast('网络错误','error'); }
      } else {
        data.username = document.getElementById('uf_username').value.trim().toLowerCase(); data.password = document.getElementById('uf_password').value;
        if (!data.username||data.username.length<2) { toast('用户名至少2个字符','error'); return; }
        if (!data.password||data.password.length<4) { toast('密码至少4个字符','error'); return; }
        try { var r2 = await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'***'+localStorage.getItem('pk_token')},body:JSON.stringify(data)}); var rd2 = await r2.json(); if (rd2.ok) { ov.remove(); toast('已创建'); PMU.render(); } else toast(rd2.detail||'创建失败','error'); } catch(e) { toast('网络错误','error'); }
      }
    };
  }

  PMU._pickAvatar = function(e, emoji) { document.getElementById('uf_avatar_preview').textContent = emoji; PMU._selAvatar = emoji; e.target.parentElement.querySelectorAll('span').forEach(function(s){s.classList.remove('sel')}); e.target.classList.add('sel'); };
  PMU._pickColor = function(e, color) { document.getElementById('uf_avatar_preview').style.background = color; PMU._selColor = color; e.target.parentElement.querySelectorAll('span').forEach(function(s){s.classList.remove('sel')}); e.target.classList.add('sel'); };

  async function toggleUser(uid, active) { if (!confirm(active?'确定启用此用户？':'确定停用此用户？')) return;
    try { var r = await fetch('/api/auth/users/'+uid,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'***'+localStorage.getItem('pk_token')},body:JSON.stringify({is_active:active})}); var d = await r.json(); if (d.ok) { toast(active?'已启用':'已停用'); PMU.render(); } } catch(e) {} }
  function confirmDelete(uid, name) { if (!confirm('确定永久删除用户「'+name+'」？此操作不可撤销。')) return;
    fetch('/api/auth/users/'+uid,{method:'DELETE',headers:{'Authorization':'***'+localStorage.getItem('pk_token')}}).then(function(){toast('已删除');PMU.render();}).catch(function(e){toast('删除失败','error');}); }

  init();
</script>
</body>
</html>
