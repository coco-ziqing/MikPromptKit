<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咪卡Mik词库 — 团队登录</title>
<style>
:root{--bg:#0f172a;--card-bg:#1e293b;--text:#f1f5f9;--text-muted:#64748b;--border:#334155;--primary:#3b82f6;--primary-light:#1e3a5f;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}
body.light-theme{--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-muted:#94a3b8;--border:#e5e7eb;--primary-light:#eff6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;transition:background .3s}
.login-wrap{width:100%;max-width:440px;padding:20px}
.login-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:36px 32px;box-shadow:0 4px 24px rgba(0,0,0,.15);transition:all .3s;position:relative}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .icon{font-size:48px;display:block;margin-bottom:8px}
.login-logo h2{font-size:22px;font-weight:800;color:var(--text);margin:0}
.login-logo p{font-size:13px;color:var(--text-muted);margin:4px 0 0}
.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top-nav a{font-size:12px;color:var(--text-muted);text-decoration:none;transition:color .2s}
.top-nav a:hover{color:var(--primary)}
.top-nav .theme-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--text-muted)}
.top-nav .theme-btn:hover{border-color:var(--primary);color:var(--primary)}

.tab-switch{display:flex;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab-btn{flex:1;padding:10px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-content{display:none;animation:fadeIn .3s}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.form-group{margin-bottom:14px;position:relative}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:5px}
.form-group input{width:100%;padding:10px 38px 10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);transition:all .2s;outline:none}
.form-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-group input.error{border-color:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.form-group input::placeholder{color:var(--text-muted)}
.pw-toggle{position:absolute;right:10px;top:30px;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;padding:2px 4px}
.pw-toggle:hover{color:var(--text)}

.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--text-muted)}
.remember-row input[type=checkbox]{accent-color:var(--primary)}
.remember-row label{cursor:pointer;user-select:none}

.btn-login{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-login:hover{background:#2563eb;transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-error{text-align:center;font-size:12px;min-height:22px;margin-top:10px;transition:color .3s}
.login-error.shake{animation:shakeX .4s}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.rate-limit-info{padding:8px 12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:8px;font-size:11px;color:var(--warning);text-align:center;margin-top:10px;display:none}

.register-info{padding:10px 12px;background:var(--primary-light);border-radius:8px;font-size:12px;color:var(--primary);margin-bottom:14px;text-align:center;line-height:1.5}
.login-footer{text-align:center;margin-top:16px;font-size:11px;color:var(--text-muted)}
.login-footer code{background:var(--border);padding:1px 6px;border-radius:3px;font-size:11px}
.server-info{font-size:11px;color:var(--text-muted);text-align:center;margin-top:20px}

.success-banner{text-align:center;padding:20px;animation:fadeIn .5s}
.success-banner .check{font-size:48px;display:block;margin-bottom:8px}
.success-banner h3{font-size:18px;color:var(--text);margin:0 0 4px}
.success-banner p{font-size:13px;color:var(--text-muted);margin:0 0 16px}
.success-banner button{padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
</style>
</head>
<body class="dark-theme">
<div class="login-wrap" id="app"></div>
<script>
var PK = {
  _tab: 'login',
  _theme: 'dark',

  init: function() {
    // 恢复记住的用户名
    try { var saved = localStorage.getItem('pk_remember_user'); if (saved) this._savedUser = saved; } catch(e) {}
    this.render();
    this._checkAutoLogin();
  },

  render: function() {
    var h = '<div class="login-card"><div class="login-logo"><span class="icon">🔍</span><h2>咪卡Mik词库</h2><p>提示词快捷检索 · 团队协作管理</p></div>';
    h += '<div class="top-nav"><a href="/">← 返回首页</a></div>';
    h += '<div class="tab-switch"><button class="tab-btn'+(this._tab==='login'?' active':'')+'" onclick="PK.switchTab(\'login\')">登录</button><button class="tab-btn'+(this._tab==='register'?' active':'')+'" onclick="PK.switchTab(\'register\')">注册</button></div>';

    if (this._tab === 'login') {
      h += '<div class="tab-content active" id="tab-login"><div class="form-group"><label>用户名</label><input type="text" id="login_username" placeholder="输入用户名" value="'+(this._savedUser||'')+'" autofocus></div>';
      h += '<div class="form-group"><label>密码</label><input type="password" id="login_password" placeholder="输入密码"><button class="pw-toggle" onclick="PK.togglePw(\'login_password\')" title="显示/隐藏">👁</button></div>';
      h += '<div class="remember-row"><input type="checkbox" id="login_remember"'+(this._savedUser?' checked':'')+'><label>记住用户名</label></div>';
      h += '<button class="btn-login" id="btn-login" onclick="PK.doLogin()">登 录</button><div class="login-error" id="login_error"></div><div class="rate-limit-info" id="rate_info">⚠ 登录尝试次数过多，请等待 15 分钟后再试</div></div>';
    } else {
      h += '<div class="tab-content active" id="tab-register"><div class="register-info">💡 新用户注册默认为「编辑员」角色，管理员可后续在用户管理中调整</div>';
      h += '<div class="form-group"><label>用户名</label><input type="text" id="reg_username" placeholder="字母/数字/下划线，2-20位"></div>';
      h += '<div class="form-group"><label>显示名称</label><input type="text" id="reg_display" placeholder="你的昵称"></div>';
      h += '<div class="form-group"><label>密码</label><input type="password" id="reg_password" placeholder="至少4个字符"><button class="pw-toggle" onclick="PK.togglePw(\'reg_password\')" title="显示/隐藏">👁</button></div>';
      h += '<button class="btn-login" id="btn-register" onclick="PK.doRegister()">注 册</button><div class="login-error" id="reg_error"></div></div>';
    }
    h += '<div class="login-footer">管理员: <code>admin</code> / <code>admin</code></div>';
    h += '</div><div class="server-info">🌐 服务主机: <span id="server_ip">'+window.location.hostname+'</span> · 端口: <span>'+window.location.port+'</span></div>';
    document.getElementById('app').innerHTML = h;

    // 绑定回车
    var pwEl = document.getElementById(this._tab==='login'?'login_password':'reg_password');
    var self = this;
    if (pwEl) pwEl.addEventListener('keydown', function(e) { if (e.key==='Enter') self._tab==='login'?self.doLogin():self.doRegister(); });
  },

  switchTab: function(tab) { this._tab = tab; this.render(); },
  toggleTheme: function() { this._theme = this._theme==='dark'?'light':'dark'; document.body.className = this._theme+'-theme'; this._theme==='dark'?document.body.classList.add('dark-theme'):null; this.render(); },
  togglePw: function(id) { var el=document.getElementById(id); el.type = el.type==='password'?'text':'password'; },

  _setError: function(id, msg, shake) {
    var el = document.getElementById(id); el.textContent = msg;
    if (shake) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  },

  doLogin: async function() {
    var u = document.getElementById('login_username').value.trim();
    var p = document.getElementById('login_password').value;
    var err = document.getElementById('login_error');
    var btn = document.getElementById('btn-login');

    document.getElementById('login_username').classList.remove('error');
    document.getElementById('login_password').classList.remove('error');

    if (!u) { document.getElementById('login_username').classList.add('error'); this._setError('login_error','请输入用户名',true); return; }
    if (!p) { document.getElementById('login_password').classList.add('error'); this._setError('login_error','请输入密码',true); return; }

    btn.disabled = true; btn.textContent = '登录中...'; this._setError('login_error','');

    try {
      var resp = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
      var data = await resp.json();
      if (data.ok) {
        if (document.getElementById('login_remember').checked) { try { localStorage.setItem('pk_remember_user', u); } catch(e) {} }
        else { try { localStorage.removeItem('pk_remember_user'); } catch(e) {} }
        localStorage.setItem('pk_token', data.token);
        localStorage.setItem('pk_user', JSON.stringify(data.user));
        // 成功动画
        document.getElementById('app').innerHTML = '<div class="login-card"><div class="success-banner"><span class="check">✅</span><h3>登录成功</h3><p>欢迎回来，'+(data.user.display_name||data.user.username)+'</p><button onclick="location.href=\'/\'">进入首页</button></div></div>';
        setTimeout(function(){ window.location.href = '/'; }, 800);
      } else if (resp.status === 429) {
        this._setError('login_error', '登录尝试次数过多');
        document.getElementById('rate_info').style.display = 'block';
      } else {
        this._setError('login_error', data.detail || '用户名或密码错误', true);
        document.getElementById('login_password').classList.add('error');
      }
    } catch(e) { this._setError('login_error', '网络错误，请检查服务是否运行', true); }
    finally { btn.disabled = false; btn.textContent = '登 录'; }
  },

  doRegister: async function() {
    var u = document.getElementById('reg_username').value.trim().toLowerCase();
    var d = document.getElementById('reg_display').value.trim();
    var p = document.getElementById('reg_password').value;
    var btn = document.getElementById('btn-register');
    document.getElementById('reg_username').classList.remove('error');
    document.getElementById('reg_password').classList.remove('error');

    if (!u || u.length < 2) { document.getElementById('reg_username').classList.add('error'); this._setError('reg_error','用户名至少2个字符',true); return; }
    if (!/^[a-z0-9_]{2,20}$/.test(u)) { document.getElementById('reg_username').classList.add('error'); this._setError('reg_error','用户名格式: 字母/数字/下划线, 2-20位',true); return; }
    if (!p || p.length < 4) { document.getElementById('reg_password').classList.add('error'); this._setError('reg_error','密码至少4个字符',true); return; }

    btn.disabled = true; btn.textContent = '注册中...'; this._setError('reg_error','');

    try {
      var resp = await fetch('/api/auth/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,display_name:d||u})});
      var data = await resp.json();
      if (data.ok) {
        this._setError('reg_error','');
        document.getElementById('reg_error').style.color = 'var(--success)';
        document.getElementById('app').innerHTML = '<div class="login-card"><div class="success-banner"><span class="check">🎉</span><h3>注册成功</h3><p>账号 <b>'+u+'</b> 已创建</p><button onclick="PK.switchTab(\'login\');PK._savedUser=\''+u+'\';PK.render();">去登录</button></div></div>';
      } else {
        document.getElementById('reg_username').classList.add('error');
        this._setError('reg_error', data.detail || '注册失败', true);
      }
    } catch(e) { this._setError('reg_error', '网络错误', true); }
    finally { btn.disabled = false; btn.textContent = '注 册'; }
  },

  _checkAutoLogin: function() {
    var token = localStorage.getItem('pk_token');
    if (token) {
      fetch('/api/auth/me', {headers:{'Authorization':'***'+token}})
        .then(function(r){return r.json();})
        .then(function(d){if(d.authenticated){window.location.href='/';}})
        .catch(function(){});
    }
  }
};
PK.init();
</script>
</body>
</html>
